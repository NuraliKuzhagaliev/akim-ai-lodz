name: Integrated project checks
on:
  push:
    branches: [main, feature/simulation]
    paths:
      [
        "backend/**",
        "frontend/**",
        "shared/**",
        ".github/workflows/backend.yml",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        "frontend/**",
        "shared/**",
        ".github/workflows/backend.yml",
      ]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AKIM_FRONTEND_REQUEST: ${{ github.workspace }}/../akim-ai-contract/request.json
      NEXT_PUBLIC_API_MODE: mock
      NEXT_PUBLIC_ENABLE_AI_COMPARISON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node backend/scripts/check_frontend_contract.mjs
      - run: python -m ruff check backend/app/api/simulation backend/app/models backend/app/simulation backend/app/main.py backend/tests backend/scripts
      - run: python -m ruff format --check backend/app/api/simulation backend/app/models backend/app/simulation backend/app/main.py backend/tests backend/scripts
      - run: python -m pytest --cov=app --cov-report=term-missing
        working-directory: backend
      - run: python backend/scripts/check_ai_contract.py
      - run: node backend/scripts/check_frontend_contract.mjs
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python backend/scripts/export_fixtures.py
      - run: git diff --exit-code -- shared/fixtures shared/openapi.json
